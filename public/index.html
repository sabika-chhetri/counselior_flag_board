<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SA Counsellor Flag Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>SA Counsellor Flag Board <small>synthetic data only</small></h1>
  <nav>
    <button id="tab-c" class="tab active">Counsellor view</button>
    <button id="tab-s" class="tab">Supervisor view</button>
  </nav>
</header>

<main>
  <div id="loader" hidden>
    <p>Could not load <code>data/SA_sample_dataset_SYNTHETIC.csv</code>. Choose the file:</p>
    <input type="file" id="file" accept=".csv">
  </div>

  <section id="counsellor">
    <div id="notes" class="notes" hidden></div>
    <div class="summary" id="summary"></div>
    <div class="filters">
      <input id="search" type="search" placeholder="Search student ID (e.g. S-016)">
      <select id="f-school"><option value="">All schools</option></select>
      <select id="f-class"><option value="">All classes</option></select>
      <select id="f-level">
        <option value="">All flags</option><option>Urgent</option><option>High</option><option>Review</option><option>None</option>
      </select>
      <label class="chk"><input type="checkbox" id="f-open"> Hide closed</label>
    </div>
    <div class="tablewrap">
      <table id="tbl">
        <thead><tr><th>Student</th><th>School</th><th>Class</th><th>Flag</th><th>Reason</th><th>Follow-up</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="supervisor" hidden>
    <p class="hint">No student IDs are shown here. Any group with fewer than 5 students shows “&lt;5”.</p>
    <div id="chart"></div>
    <div class="tablewrap">
      <table id="agg">
        <thead><tr><th>School</th><th>Class</th><th>Students</th><th>Urgent</th><th>High</th><th>Review</th><th>None</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
